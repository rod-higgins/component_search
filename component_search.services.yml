services:
  component_search.content_extractor:
    class: Drupal\component_search\Service\ComponentContentExtractor
    arguments:
      - '@component_field.discovery'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.factory'
      - '@cache.default'

  component_search.search_manager:
    class: Drupal\component_search\Service\ComponentSearchManager
    arguments:
      - '@component_search.content_extractor'
      - '@?search.index'
      - '@config.factory'
      - '@module_handler'

  component_search.event_subscriber:
    class: Drupal\component_search\EventSubscriber\ComponentSearchSubscriber
    arguments:
      - '@component_search.search_manager'
    tags:
      - { name: event_subscriber }

  component_search.indexing_helper:
    class: Drupal\component_search\Service\ComponentIndexingHelper
    arguments:
      - '@component_search.content_extractor'
      - '@entity_type.manager'
      - '@config.factory'

  component_search.cache_manager:
    class: Drupal\component_search\Service\ComponentSearchCacheManager
    arguments:
      - '@cache.default'
      - '@config.factory'

  # Parameter converter for entity routes
  component_search.entity_converter:
    class: Drupal\component_search\ParamConverter\ComponentSearchEntityConverter
    tags:
      - { name: paramconverter }

  # Cache context for component content
  cache_context.component_search:
    class: Drupal\component_search\Cache\ComponentSearchCacheContext
    arguments:
      - '@request_stack'
    tags:
      - { name: cache.context }

  # Queue worker for background indexing
  plugin.manager.component_search_queue_worker:
    class: Drupal\component_search\Plugin\QueueWorker\ComponentSearchIndexWorker
    parent: default_plugin_manager